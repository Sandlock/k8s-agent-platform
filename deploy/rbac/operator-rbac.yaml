apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandlock-operator
  namespace: sandlock-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandlock-operator
rules:
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes", "sandboxpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes/status", "sandboxpools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandlock-operator
subjects:
  - kind: ServiceAccount
    name: sandlock-operator
    namespace: sandlock-system
roleRef:
  kind: ClusterRole
  name: sandlock-operator
  apiGroup: rbac.authorization.k8s.io
---
# Control plane service account — scoped to sandboxes namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandlock-controlplane
  namespace: sandlock-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandlock-controlplane
  namespace: sandboxes
rules:
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandlock-controlplane
  namespace: sandboxes
subjects:
  - kind: ServiceAccount
    name: sandlock-controlplane
    namespace: sandlock-system
roleRef:
  kind: Role
  name: sandlock-controlplane
  apiGroup: rbac.authorization.k8s.io
