apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandlock-controlplane
  namespace: sandlock-system
  labels:
    app.kubernetes.io/name: sandlock-controlplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandlock-controlplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandlock-controlplane
    spec:
      serviceAccountName: sandlock-controlplane
      containers:
        - name: controlplane
          image: sandlock/controlplane:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: ":8090"
            - name: SANDBOX_NAMESPACE
              value: "sandboxes"
          ports:
            - name: api
              containerPort: 8090
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandlock-controlplane
  namespace: sandlock-system
spec:
  selector:
    app.kubernetes.io/name: sandlock-controlplane
  ports:
    - name: api
      port: 8090
      targetPort: 8090
  type: ClusterIP
