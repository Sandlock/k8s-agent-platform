{{- if and (not .Values.postgresql.enabled) .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: sandlock-db
  namespace: {{ include "sandlock.systemNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- if and .Values.masterKey (not .Values.masterKeyExistingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sandlock-master-key
  namespace: {{ include "sandlock.systemNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
type: Opaque
stringData:
  MASTER_KEY: {{ .Values.masterKey | quote }}
{{- end }}
