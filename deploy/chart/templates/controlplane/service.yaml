apiVersion: v1
kind: Service
metadata:
  name: sandlock-controlplane
  namespace: {{ include "sandlock.systemNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  type: {{ .Values.controlplane.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "sandlock.name" . }}
    app.kubernetes.io/component: controlplane
  ports:
    - name: api
      port: {{ .Values.controlplane.service.port }}
      targetPort: api
      protocol: TCP
