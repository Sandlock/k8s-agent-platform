apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sandlock.fullname" . }}-operator
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
rules:
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes", "sandboxpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes/status", "sandboxpools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sandlock.fullname" . }}-operator
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sandlock-operator
    namespace: {{ include "sandlock.systemNamespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "sandlock.fullname" . }}-operator
  apiGroup: rbac.authorization.k8s.io
