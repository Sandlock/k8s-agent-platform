apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sandlock.fullname" . }}-controlplane
  namespace: {{ include "sandlock.sandboxNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
rules:
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes", "sandboxpools"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["sandlock.dev"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sandlock.fullname" . }}-controlplane
  namespace: {{ include "sandlock.sandboxNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sandlock-controlplane
    namespace: {{ include "sandlock.systemNamespace" . }}
roleRef:
  kind: Role
  name: {{ include "sandlock.fullname" . }}-controlplane
  apiGroup: rbac.authorization.k8s.io
