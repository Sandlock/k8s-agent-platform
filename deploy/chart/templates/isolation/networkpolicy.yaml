{{- if .Values.isolation.networkPolicies.enabled }}
# Default-deny all traffic in the sandbox namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ include "sandlock.sandboxNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow the control plane to reach supervisor ports 8080 (control) and 8081 (terminal).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controlplane-ingress
  namespace: {{ include "sandlock.sandboxNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sandlock-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "sandlock.systemNamespace" . }}
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
---
# Allow egress to Anthropic API (port 443) and DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-anthropic-egress
  namespace: {{ include "sandlock.sandboxNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sandlock-operator
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow sandbox pods to push session snapshots to the control plane on harness exit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-snapshot-push-egress
  namespace: {{ include "sandlock.sandboxNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "sandlock.systemNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controlplane
      ports:
        - port: {{ .Values.controlplane.service.port }}
          protocol: TCP
{{- end }}
