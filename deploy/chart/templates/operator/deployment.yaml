apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandlock-operator
  namespace: {{ include "sandlock.systemNamespace" . }}
  labels:
    {{- include "sandlock.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sandlock.name" . }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sandlock.name" . }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: sandlock-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "sandlock.image" (list . "operator") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --supervisor-image={{ include "sandlock.image" (list . "supervisor") }}
            {{- if .Values.operator.runtimeClass }}
            - --runtime-class={{ .Values.operator.runtimeClass }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8383
              protocol: TCP
            - name: healthz
              containerPort: 8384
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
