# -- Container registry prefix
registry: ghcr.io
# -- GitHub owner / org (images are ghcr.io/<owner>/sandlock-<component>)
owner: sandlock

# -- Image tag applied to all images (override per-component below)
imageTag: latest

# -- Image pull policy
imagePullPolicy: Always

# -- Kubernetes namespace for control-plane components
systemNamespace: sandlock-system

# -- Kubernetes namespace where sandbox pods run
sandboxNamespace: sandboxes

# ── Supervisor image (used by the SandboxTemplate) ───────────────────────────
supervisor:
  image: ""  # defaults to registry/owner/sandlock-supervisor:imageTag

# ── Control plane ─────────────────────────────────────────────────────────────
controlplane:
  image: ""  # defaults to registry/owner/sandlock-controlplane:imageTag
  replicas: 1
  # In-cluster URL that sandbox pods use to push session snapshots back to the
  # control plane.  Defaults to the ClusterIP service URL; override only when
  # you expose the control plane on a different in-cluster address.
  selfUrl: ""  # default: http://sandlock-controlplane.<systemNamespace>.svc.cluster.local:<port>
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8090
    # Set to LoadBalancer and provide a loadBalancerIP to expose externally.
  ingress:
    enabled: true
    className: "nginx"
    host: "sandlock.stevefraser.dev"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: sandlock.stevefraser.dev
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    tls:
      enabled: true
      secretName: "sandlock-tls"

# ── PostgreSQL (bundled) ──────────────────────────────────────────────────────
# Set postgresql.enabled=true for a simple all-in-one install.
# For production, disable this and provide database.url or database.existingSecret.
postgresql:
  enabled: true
  auth:
    database: sandlock
    username: sandlock
    # Auto-generated and stored in <release>-postgresql secret if left empty.
    password: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# ── Database (external) ───────────────────────────────────────────────────────
# Ignored when postgresql.enabled=true.
# Required for auth (M2) and BYOK key storage (M3).
# Leave empty to run in no-auth dev mode (in-memory sandbox store).
database:
  # Full PostgreSQL DSN: postgres://user:pass@host:5432/dbname?sslmode=disable
  url: ""
  # Reference an existing Secret instead of creating one from `url` above.
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# ── Admin user ────────────────────────────────────────────────────────────────
# Leave empty to auto-generate a password and store it in the sandlock-admin Secret.
# Retrieve it with: kubectl get secret sandlock-admin -n sandlock-system -o jsonpath='{.data.password}' | base64 -d
admin:
  password: ""

# ── BYOK key encryption ───────────────────────────────────────────────────────
# 32-byte hex string (openssl rand -hex 32). Auto-generated and stored in the
# sandlock-master-key Secret if left empty — stable across upgrades.
# To use an existing secret instead, set masterKeyExistingSecret.
masterKey: ""
masterKeyExistingSecret: ""
masterKeyExistingSecretKey: MASTER_KEY

# ── Warm pool (M4) ────────────────────────────────────────────────────────────
pool:
  enabled: true
  harness: claude-code
  targetReady: 1
  maxTotal: 20
  podTtlSeconds: 3600

# ── Sandbox service account & RBAC ────────────────────────────────────────────
sandbox:
  networkPolicy:
    ingress:
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
    egress:
      ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 6443
          protocol: TCP
  serviceAccount:
    # Create a ServiceAccount for sandbox pods in the sandbox namespace.
    create: true
    # Override the generated name (defaults to <fullname>-sandbox).
    name: ""
    # Annotations added to the ServiceAccount (e.g. for IRSA / Workload Identity).
    annotations: {}
  rbac:
    # Create a Role + RoleBinding in the sandbox namespace.
    # Requires sandbox.serviceAccount.create=true or sandbox.serviceAccount.name set.
    create: true
    # Rules for the Role. Example:
    # rules:
    #   - apiGroups: [""]
    #     resources: ["configmaps", "secrets"]
    #     verbs: ["get", "list"]
    rules: []
    # Bind to an existing Role or ClusterRole instead of (or in addition to) creating one.
    existingRole:
      name: cluster-admin
      # "Role" or "ClusterRole"
      kind: ClusterRole
      # "RoleBinding" (namespace-scoped) or "ClusterRoleBinding" (cluster-wide).
      # Use ClusterRoleBinding when the role grants cluster-wide permissions.
      bindingKind: ClusterRoleBinding

# ── Isolation (M6) ────────────────────────────────────────────────────────────
isolation:
  # Install the gVisor RuntimeClass.
  runtimeClass:
    enabled: false
  # Apply default-deny NetworkPolicies in the sandbox namespace.
  networkPolicies:
    enabled: true
