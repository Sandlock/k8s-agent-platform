# Default-deny all traffic in the sandboxes namespace,
# then allowlist only what the agent actually needs.

# 1. Deny everything by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sandboxes
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Allow control-plane → supervisor control channel (:8080) and terminal bridge (:8081).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controlplane-ingress
  namespace: sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sandlock-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandlock-system
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
---
# 3. Allow egress to the Anthropic API only (port 443).
#    Agents need to reach api.anthropic.com — nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-anthropic-egress
  namespace: sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sandlock-operator
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
    # DNS (required for hostname resolution)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
