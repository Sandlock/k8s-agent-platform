apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.sandlock.dev
spec:
  group: sandlock.dev
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
    shortNames:
      - sb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Harness
          type: string
          jsonPath: .spec.harness
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                harness:
                  type: string
                  default: claude-code
                pool:
                  type: boolean
                  default: false
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                ttlSeconds:
                  type: integer
                  format: int64
                  default: 3600
                idleTimeoutSeconds:
                  type: integer
                  format: int64
                  default: 900
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Warming", "Ready", "Claimed", "Recycling", "Failed"]
                podName:
                  type: string
                claimedBy:
                  type: string
                lastHeartbeat:
                  type: string
                  format: date-time
                message:
                  type: string
