apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxpools.sandlock.dev
spec:
  group: sandlock.dev
  names:
    kind: SandboxPool
    listKind: SandboxPoolList
    plural: sandboxpools
    singular: sandboxpool
    shortNames:
      - sbpool
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Harness
          type: string
          jsonPath: .spec.harness
        - name: TargetReady
          type: integer
          jsonPath: .spec.targetReady
        - name: Ready
          type: integer
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["harness"]
              properties:
                harness:
                  type: string
                  default: claude-code
                targetReady:
                  type: integer
                  format: int32
                  default: 0
                maxTotal:
                  type: integer
                  format: int32
                  default: 50
                podTtlSeconds:
                  type: integer
                  format: int64
                  default: 3600
            status:
              type: object
              properties:
                ready:
                  type: integer
                  format: int32
                total:
                  type: integer
                  format: int32
